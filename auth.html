<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VAREL — Sign In / Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <style>
      .auth-wrap{max-width:520px;margin:120px auto;padding:48px;background:#0b0b0b;border:1px solid #222;border-radius:8px}
      .tabs{display:flex;gap:12px;margin-bottom:18px}
      .tabs button{flex:1;padding:10px;border:0;background:#111;color:#ddd;cursor:pointer}
      .tabs button.active{background:#c9a45c;color:#080808}
      .auth-form{display:block}
      .auth-form label{display:block;margin-bottom:8px;color:#aaa;font-size:13px}
      .auth-form input{width:100%;padding:12px;margin-bottom:12px;background:#090909;border:1px solid #333;color:#fff}
      .auth-actions{display:flex;gap:10px;align-items:center}
      .note{color:#888;margin-top:12px;font-size:13px}
    </style>
  </head>
  <body>
    <main class="auth-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <a class="logo">VAREL</a>
        <a href="/">Back</a>
      </div>

      <div class="tabs">
        <button id="signInTab" class="active">Sign In</button>
        <button id="signUpTab">Sign Up</button>
      </div>

      <form id="authForm" class="auth-form">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@example.com">

        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="Enter a password">

        <div class="auth-actions">
          <button class="btn" id="submitBtn">Continue</button>
          <div style="flex:1"></div>
        </div>

        <p class="note">By continuing you agree to the demo terms. This is a UI-only flow.</p>
      </form>
    </main>

    <script>
      // Prefill email if provided via query param
      const params = new URLSearchParams(location.search);
      const emailParam = params.get('email');
      if (emailParam) document.getElementById('email').value = decodeURIComponent(emailParam);

      const signInTab = document.getElementById('signInTab');
      const signUpTab = document.getElementById('signUpTab');
      const authForm = document.getElementById('authForm');
      let mode = 'signin';

      function setMode(m) {
        mode = m;
        signInTab.classList.toggle('active', m === 'signin');
        signUpTab.classList.toggle('active', m === 'signup');
        document.getElementById('submitBtn').textContent = m === 'signin' ? 'Sign in' : 'Create account';
      }

      signInTab.onclick = () => setMode('signin');
      signUpTab.onclick = () => setMode('signup');

      authForm.onsubmit = (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Demo behavior: store a flag and show a simple message.
        localStorage.varelUser = JSON.stringify({ email, createdAt: Date.now() });
        alert(mode === 'signin' ? 'Signed in (demo).' : 'Account created (demo).');
        location.href = '/';
      };
    </script>
  </body>
</html>
